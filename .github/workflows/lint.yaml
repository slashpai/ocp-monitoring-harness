name: Lint

on:
  pull_request:
    paths:
      - "**.md"
      - ".markdownlint-cli2.jsonc"
  push:
    branches: [main]
    paths:
      - "**.md"
      - ".markdownlint-cli2.jsonc"

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run markdownlint
        run: make lint CONTAINER_ENGINE=docker
