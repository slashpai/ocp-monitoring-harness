name: Checks

on:
  pull_request:
    paths:
      - "**.md"
      - ".mdox.validate.yaml"
  push:
    branches: [main]
    paths:
      - "**.md"
      - ".mdox.validate.yaml"

permissions:
  contents: read

jobs:
  markdown-checks:
    name: markdown checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.5.0
        with:
          go-version: stable
          cache: false

      - name: Run mdox lint
        run: make lint
