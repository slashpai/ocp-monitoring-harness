version: 1

validators:
  # Skip GitHub repos — avoid rate limiting on roundtrip and API checks
  - regex: '(^http[s]?:\/\/)(www\.)?(github\.com\/)'
    type: 'ignore'
  # Skip Red Hat docs — behind CDN/auth that trips roundtrip checks
  - regex: '(^http[s]?:\/\/)(www\.)?(docs\.redhat\.com|developers\.redhat\.com)\/'
    type: 'ignore'
  # Skip other external sites
  - regex: '(^http[s]?:\/\/)(www\.)?(agentskills\.io|anthropic\.com|cursor\.com|docs\.anthropic\.com)\/'
    type: 'ignore'
